<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>이미지 웹페이지</title>
  <style>
    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
      color: #ffffff;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: min(1100px, 100%);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .image-wrap {
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 18px 0 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
      cursor: pointer;
      border: 0;
    }

    .btn-primary {
      background: #ffffff;
      color: #111827;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .page { padding: 14px; }
      .card { padding: 10px; border-radius: 18px; }
      .image-wrap { border-radius: 12px; }
      .actions { padding-top: 12px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="이미지 웹페이지">
      <div class="image-wrap">
        <img src="11.png" alt="웹페이지 메인 이미지" loading="eager" />
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="11.png" target="_blank" rel="noopener">이미지 크게 보기</a>
        <button class="btn btn-secondary" type="button" onclick="window.scrollTo({top:0, behavior:'smooth'})">맨 위로</button>
      </div>
    </section>
  </main>
</body>
</html>
